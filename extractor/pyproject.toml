[project]
name = "extractor-service"
version = "0.1.0"
description = "Microservicio sin estado que extrae el texto de un PDF."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pypdf>=4.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
# Es un servicio, no una librería: no se empaqueta.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
