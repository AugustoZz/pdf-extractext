# Nombre de proyecto propio: sin él, Compose usa el nombre de la carpeta, y otro
# repo llamado pdf-extractext (por ejemplo, el de otro grupo) pisaría estos contenedores.
name: pdf-extractext-mansalve-praderio-quiroga

# Los puertos del host son configurables (ver .env.example) por si ya están en uso.
services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Sobrescribimos el URI para que apunte al contenedor de MongoDB en lugar de localhost
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=pdf_extractext
      - APP_NAME=pdf-extractext
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - MAX_FILE_SIZE_MB=10
      - PDF_ALLOWED_MIME_TYPE=application/pdf
    depends_on:
      mongodb:
        # service_healthy (y no service_started) porque la API verifica la
        # conexión al arrancar y aborta si Mongo todavía no acepta consultas.
        # "started" sólo garantiza que el contenedor arrancó, no que mongod
        # haya terminado de inicializarse.
        condition: service_healthy
    volumes:
      # Sincroniza el código fuente para recarga en vivo (hot reload)
      - .:/app
    # Reinicia uvicorn en modo watch para el desarrollo
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      # Expuesto para los tests de integración que corren desde el host.
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      # Margen para el primer arranque, cuando mongod crea los archivos de datos.
      start_period: 30s

  # ── Extractor ───────────────────────────────────────────────────
  # Sin ports: un puerto del host no se puede repartir entre réplicas.
  # Se accede sólo a través de extractor-lb.
  extractor:
    build: ./extractor
    deploy:
      # El TP permite hasta 5 réplicas; variable para comparar escenarios.
      replicas: ${EXTRACTOR_REPLICAS:-5}
      resources:
        # Límites máximos que admite el TP por réplica.
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  extractor-lb:
    image: nginx:1.27-alpine
    ports:
      # 8080 es el puerto al que apuntan los scripts del profesor.
      - "${EXTRACTOR_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      extractor:
        # nginx resuelve las IPs de las réplicas al arrancar: tienen que existir ya.
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # Con 256M el kernel mataba workers de nginx bajo el spike de 100 VUs.
          memory: 512M
    restart: unless-stopped

  # ── Pruebas de carga ────────────────────────────────────────────
  # Perfil "stress": no arrancan con `docker compose up`, se corren a pedido.
  k6:
    image: grafana/k6:2.3.0
    profiles: ["stress"]
    command: ["run", "--summary-export=/stress/results/k6-spike.json", "/stress/k6/spike.js"]
    environment:
      # Dashboard en vivo (http://localhost:5665) y exportado a HTML para el informe.
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_EXPORT=/stress/results/k6-spike.html
    ports:
      - "5665:5665"
    volumes:
      - ./tests/stress:/stress
    depends_on:
      - extractor-lb

  vegeta:
    build: ./tests/stress/vegeta
    profiles: ["stress"]
    entrypoint: ["sh", "/stress/vegeta/run.sh"]
    volumes:
      - ./tests/stress:/stress
    depends_on:
      - extractor-lb

volumes:
  mongo_data:
