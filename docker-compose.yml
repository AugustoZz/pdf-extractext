# Los puertos del host son configurables (ver .env.example) por si ya están en uso.
services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Sobrescribimos el URI para que apunte al contenedor de MongoDB en lugar de localhost
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=pdf_extractext
      - APP_NAME=pdf-extractext
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=INFO
      - MAX_FILE_SIZE_MB=10
      - PDF_ALLOWED_MIME_TYPE=application/pdf
      - EXTRACTOR_URL=${EXTRACTOR_URL:-http://extractor-lb/extract}
      - EXTRACTOR_TIMEOUT_SECONDS=${EXTRACTOR_TIMEOUT_SECONDS:-30}
    depends_on:
      mongodb:
        # service_healthy (y no service_started) porque la API verifica la
        # conexión al arrancar y aborta si Mongo todavía no acepta consultas.
        # "started" sólo garantiza que el contenedor arrancó, no que mongod
        # haya terminado de inicializarse.
        condition: service_healthy
      extractor-lb:
        condition: service_started
    volumes:
      # Permite desarrollar sin reconstruir la imagen; reiniciar api tras editar.
      - .:/app
    # Sin watcher: la carga no consume CPU vigilando PDFs y archivos de resultados.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    deploy:
      resources:
        # El TP pide límites explícitos en cada contenedor. La api no participa de
        # las pruebas de carga: con poco le alcanza y le deja CPU al extractor.
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      # Expuesto para los tests de integración que corren desde el host.
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          cpus: "0.5"
          # mongod ajusta su caché al límite del contenedor.
          memory: 1G
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      # Margen para el primer arranque, cuando mongod crea los archivos de datos.
      start_period: 30s

  # ── Extractor ───────────────────────────────────────────────────
  # Microservicio en su propio repositorio; Compose lo construye desde ahí.
  # Las pruebas de carga, nginx y el informe del TP viven en ese repo:
  # https://github.com/valendotjpg/pdf-extractext-extractor
  # Sin ports: nginx distribuye las peticiones entre las cinco replicas.
  extractor:
    build: ${EXTRACTOR_BUILD_CONTEXT:-https://github.com/AugustoZz/pdf-extractext-extractor.git#492646ed9ab7a949019b16dbab021eefc2eddce9}
    command: uvicorn extractor_service.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 60 --no-access-log
    deploy:
      # El TP permite hasta 5 réplicas.
      replicas: ${EXTRACTOR_REPLICAS:-5}
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  extractor-lb:
    image: nginx:1.27-alpine
    ports:
      - "${EXTRACTOR_PORT:-8080}:80"
    volumes:
      - ./nginx/extractor.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      extractor:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

volumes:
  mongo_data:
