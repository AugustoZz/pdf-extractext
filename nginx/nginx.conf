# Balanceador del extractor-service: reparte las peticiones entre las réplicas.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream extractor {
        # Los PDFs tardan distinto según tamaño y densidad: least_conn evita
        # mandar trabajo a una réplica que todavía está ocupada con uno pesado.
        least_conn;
        # El DNS de Docker devuelve la IP de cada réplica, y nginx las toma todas.
        server extractor:8000;
    }

    server {
        listen 80;

        # Por encima del límite del extractor (10 MB),
        # para que el rechazo por tamaño lo responda el servicio según el contrato.
        client_max_body_size 12m;
        # Tamaño de bloque con el que se lee y reenvía el body. Con el valor por
        # defecto (16 KB), un PDF de 9 MB son cientos de lecturas y nginx se
        # saturaba de CPU. Más grande cuesta memoria: ~100 conexiones × 1 MB
        # superaban el límite del contenedor.
        client_body_buffer_size 256k;

        location / {
            proxy_pass http://extractor;
            # Por defecto nginx guarda en disco cada body de más de 16 KB antes de
            # reenviarlo; con PDFs de varios MB eso lo dejaba al 100 % de CPU.
            # Así el PDF pasa directo a la réplica.
            proxy_request_buffering off;
        }
    }
}
