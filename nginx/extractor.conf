# Balanceador del extractor; cinco replicas, un worker por su limite de CPU.
worker_processes 1;

events {
    worker_connections 4096;
}

http {
    upstream extractor {
        zone extractor 64k;
        least_conn;
        server extractor:8000 max_fails=0;
        keepalive 32;
        keepalive_timeout 30s;
    }

    server {
        listen 80;
        client_max_body_size 12m;
        client_body_buffer_size 256k;

        location / {
            proxy_pass http://extractor;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Reenviar el PDF directamente evita archivos temporales y CPU de disco.
            proxy_request_buffering off;
        }
    }
}
